    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
    <script>
      const state = {
        layers: [],
        selectedLayerId: null,
        canvasSize: { width: 1200, height: 800 },
        zoom: 1,
        activeTool: 'move',
        marquee: null,
      gradient: {
        stops: [
          { id: crypto.randomUUID(), color: '#1d9bf0', pos: 0 },
          { id: crypto.randomUUID(), color: '#f0ad4e', pos: 100 }
        ],
        radius: 50,
        focusX: 50,
        focusY: 50,
        mode: 'radial'
      },
        windowBounds: { left: 160, top: 40, width: 780, height: 520 }
      };

      const canvas = document.getElementById('mainCanvas');
      const ctx = canvas.getContext('2d');
      const canvasShell = document.getElementById('canvasShell');
      const zoomBadge = document.getElementById('zoomBadge');
      const zoomHint = document.getElementById('zoomHint');
      const layersList = document.getElementById('layersList');
      const statusLayer = document.getElementById('statusLayer');
      const statusCoords = document.getElementById('statusCoords');
      const gradientEditor = document.getElementById('gradientEditor');
      const gradientStops = document.getElementById('gradientStops');
      const radiusInput = document.getElementById('gradientRadius');
      const focusXInput = document.getElementById('focusX');
      const focusYInput = document.getElementById('focusY');
      const radiusValue = document.getElementById('radiusValue');
      const focusXValue = document.getElementById('focusXValue');
      const focusYValue = document.getElementById('focusYValue');
      const gradientTypeSelect = document.getElementById('gradientType');
      const textEditor = document.getElementById('textEditor');
      const textStringInput = document.getElementById('textString');
      const textFontSizeInput = document.getElementById('textFontSize');
      const textFontFamilySelect = document.getElementById('textFontFamily');
      const textColorInput = document.getElementById('textColor');
      const resizeWidth = document.getElementById('resizeWidth');
      const resizeHeight = document.getElementById('resizeHeight');
      const canvasWidthInput = document.getElementById('canvasWidth');
      const canvasHeightInput = document.getElementById('canvasHeight');
      const aspectLockBtn = document.getElementById('aspectLockBtn');
      const layerWidthInput = document.getElementById('layerWidth');
      const layerHeightInput = document.getElementById('layerHeight');
      const layerAspectLock = document.getElementById('layerAspectLock');
      const layerRotateInput = document.getElementById('layerRotate');
      const layerFlipBtn = document.getElementById('layerFlip');
      const fillColorInput = document.getElementById('fillColor');
      const docTitle = document.getElementById('docTitle');
      const docWindow = document.querySelector('.document-window');
      const docHeader = document.querySelector('.document-header');
      const resizeHandle = document.getElementById('resizeHandle');
      const fileMenuNew = document.querySelector('[data-action="menu-new"]');
      const fileMenuSave = document.querySelector('[data-action="menu-save"]');
      const fileMenuDelete = document.querySelector('[data-action="menu-delete"]');
      const windowMenu = document.getElementById('windowMenu');
      const pluginMenuLensFlare = document.querySelector('[data-action="plugin-lens-flare"]');
      const STORAGE_KEY = 'indiedraw-workspace';
      const historyStack = [];
      const MAX_HISTORY = 30;
      let historyIndex = -1;
      let isApplyingHistory = false;
      const windows = [];
      let activeWindowIndex = 0;
      let aspectLockActive = true;
      let aspectRatio = state.canvasSize.width / state.canvasSize.height;
      let linkingInputs = false;
      let layerAspectLockActive = true;
      let layerRotate = 0;
      let layerFlipped = false;
      
      canvas.width = state.canvasSize.width;
      canvas.height = state.canvasSize.height;
      canvas.style.width = state.canvasSize.width + 'px';
      canvas.style.height = state.canvasSize.height + 'px';

      function syncCanvasInputs() {
        if (canvasWidthInput) canvasWidthInput.value = state.canvasSize.width;
        if (canvasHeightInput) canvasHeightInput.value = state.canvasSize.height;
        if (gradientTypeSelect) gradientTypeSelect.value = state.gradient.mode;
      }

      const DEFAULT_GRADIENT_STOPS = [
        { color: '#1d9bf0', pos: 0 },
        { color: '#f0ad4e', pos: 100 }
      ];

      function blankSnapshot() {
        return {
          canvasSize: { width: 1200, height: 800 },
          zoom: 1,
          selectedLayerId: null,
          gradient: {
            stops: DEFAULT_GRADIENT_STOPS.map((stop) => ({ ...stop })),
            radius: 50,
            focusX: 50,
            focusY: 50
          },
          layers: [],
          windowBounds: { ...state.windowBounds }
        };
      }

      function persistWindows() {
        const payload = {
          windows: windows.map(({ id, title, snapshot }) => ({ id, title, snapshot })),
          activeWindowIndex
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      function initializeWindows() {
        windows.length = 0;
        windows.push({
          id: crypto.randomUUID(),
          title: 'Untitled-1',
          snapshot: blankSnapshot()
        });
        activeWindowIndex = 0;
        updateWindowMenu();
      }

      function saveCurrentWindowSnapshot() {
        if (!windows[activeWindowIndex]) return;
        windows[activeWindowIndex].snapshot = serializeWorkspace();
        persistWindows();
      }

      function updateWindowMenu() {
        if (!windowMenu) return;
        windowMenu.innerHTML = '';
        windows.forEach((win, idx) => {
          const button = document.createElement('button');
          button.textContent = win.title + (idx === activeWindowIndex ? ' ✓' : '');
          button.addEventListener('click', () => setActiveWindow(idx));
          windowMenu.appendChild(button);
        });
      }

      async function setActiveWindow(index) {
        if (index === activeWindowIndex) return;
        if (index < 0 || index >= windows.length) return;
        saveCurrentWindowSnapshot();
        activeWindowIndex = index;
        await applySnapshot(windows[index].snapshot);
        resetHistory();
        updateWindowMenu();
        persistWindows();
      }

      function resetHistory() {
        historyStack.length = 0;
        historyIndex = -1;
        captureSnapshot();
      }

      async function createNewWindow() {
        saveCurrentWindowSnapshot();
        const title = `Untitled-${windows.length + 1}`;
        windows.push({ id: crypto.randomUUID(), title, snapshot: blankSnapshot() });
        await setActiveWindow(windows.length - 1);
        updateWindowMenu();
      }

      function saveWindowTitle() {
        const newTitle = prompt('Name this window', windows[activeWindowIndex]?.title || 'Untitled');
        if (newTitle) {
          windows[activeWindowIndex].title = newTitle;
          updateWindowMenu();
          updateDocTitle();
        }
      }

      syncCanvasInputs();

      function updateDimensionInputs(kind, value) {
        if (kind === 'width') {
          if (resizeWidth) resizeWidth.value = value;
          if (canvasWidthInput) canvasWidthInput.value = value;
        } else {
          if (resizeHeight) resizeHeight.value = value;
          if (canvasHeightInput) canvasHeightInput.value = value;
        }
      }

      function handleLinkedDimension(kind, rawValue) {
        if (!aspectLockActive || linkingInputs) return;
        const value = Number(rawValue);
        if (Number.isNaN(value)) return;
        linkingInputs = true;
        if (kind === 'width') {
          const height = Math.max(64, Math.round(value / aspectRatio));
          updateDimensionInputs('height', height);
        } else {
          const width = Math.max(64, Math.round(value * aspectRatio));
          updateDimensionInputs('width', width);
        }
        linkingInputs = false;
      }

      function handleLayerDimension(kind, rawValue) {
        if (!layerAspectLockActive || linkingInputs) return;
        const value = Number(rawValue);
        if (Number.isNaN(value)) return;
        linkingInputs = true;
        if (kind === 'width') {
          const height = Math.max(1, Math.round(value / layerAspectRatio()));
          layerHeightInput.value = height;
        } else {
          const width = Math.max(1, Math.round(value * layerAspectRatio()));
          layerWidthInput.value = width;
        }
        linkingInputs = false;
      }

      function layerAspectRatio() {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        return layer && layer.canvas.height ? layer.canvas.width / layer.canvas.height : 1;
      }

      function toggleLayerAspectLock() {
        layerAspectLockActive = !layerAspectLockActive;
        layerAspectLock?.classList.toggle('active', layerAspectLockActive);
        layerAspectLock && (layerAspectLock.textContent = layerAspectLockActive ? '🔒' : '🔓');
      }

      function drawTransformedCanvas(base, width, height, angle, flipped) {
        const temp = document.createElement('canvas');
        temp.width = width;
        temp.height = height;
        const ctx = temp.getContext('2d');
        ctx.save();
        ctx.translate(width / 2, height / 2);
        if (flipped) ctx.scale(-1, 1);
        ctx.rotate((angle * Math.PI) / 180);
        ctx.drawImage(base, -base.width / 2, -base.height / 2, base.width, base.height);
        ctx.restore();
        return temp;
      }

      function applyLayerResize(finalize = true) {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer) return;
        const newW = Math.max(1, parseInt(layerWidthInput.value, 10));
        const newH = Math.max(1, parseInt(layerHeightInput.value, 10));
        if (!newW || !newH) return;
        const base = layerResizeBase.canvas || layer.canvas;
        if (!base) return;
        if (newW === layer.canvas.width && newH === layer.canvas.height) return;
        if (finalize) captureSnapshot();
        const temp = document.createElement('canvas');
        temp.width = newW;
        temp.height = newH;
        temp.getContext('2d').drawImage(base, 0, 0, newW, newH);
        const deltaX = (layerResizeBase.width - newW) / 2;
        const deltaY = (layerResizeBase.height - newH) / 2;
        layer.canvas = temp;
        layer.x = layerResizeBase.x + deltaX;
        layer.y = layerResizeBase.y + deltaY;
        renderCanvas();
        updateLayerPanel();
        if (finalize) saveWorkspace();
        if (finalize) captureLayerBase();
      }

      function applyLayerRotation(finalize = true) {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer) return;
        const base = layerResizeBase.canvas || layer.canvas;
        if (!base) return;
        const rad = (layerRotate % 360) * (Math.PI / 180);
        const cos = Math.abs(Math.cos(rad));
        const sin = Math.abs(Math.sin(rad));
        const targetWidth = Math.max(1, Math.round(cos * base.width + sin * base.height));
        const targetHeight = Math.max(1, Math.round(sin * base.width + cos * base.height));
        if (!layerFlipped && layerRotate % 360 === 0 && targetWidth === layer.canvas.width && targetHeight === layer.canvas.height) {
          return;
        }
        if (finalize) captureSnapshot();
        const temp = drawTransformedCanvas(base, targetWidth, targetHeight, layerRotate, layerFlipped);
        const deltaX = (layerResizeBase.width - targetWidth) / 2;
        const deltaY = (layerResizeBase.height - targetHeight) / 2;
        layer.canvas = temp;
        layer.x = layerResizeBase.x + deltaX;
        layer.y = layerResizeBase.y + deltaY;
        layerWidthInput && (layerWidthInput.value = targetWidth);
        layerHeightInput && (layerHeightInput.value = targetHeight);
        renderCanvas();
        updateLayerPanel();
        if (finalize) {
          saveWorkspace();
          captureLayerBase();
        }
      }

      function applyLensFlareToLayer(layer) {
        if (!layer) return;
        const width = layer.canvas.width;
        const height = layer.canvas.height;
        const cx = width / 2;
        const cy = height / 2;
        const radius = Math.min(width, height) * 0.45;
        const flare = document.createElement('canvas');
        flare.width = width;
        flare.height = height;
        const fctx = flare.getContext('2d');
        const gradient = fctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        gradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        gradient.addColorStop(0.35, 'rgba(255,255,224,0.5)');
        gradient.addColorStop(0.7, 'rgba(255,255,255,0.1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        fctx.fillStyle = gradient;
        fctx.fillRect(0, 0, width, height);
        const streakCount = 4;
        const streakLength = radius * 1.4;
        for (let i = 0; i < streakCount; i++) {
          const angle = (Math.PI / 2) * i / (streakCount / 2);
          fctx.save();
          fctx.translate(cx, cy);
          fctx.rotate(angle);
          const streak = fctx.createLinearGradient(-streakLength, 0, streakLength, 0);
          streak.addColorStop(0, 'rgba(255,255,255,0)');
          streak.addColorStop(0.45, 'rgba(255,255,255,0.6)');
          streak.addColorStop(0.55, 'rgba(255,255,255,0.9)');
          streak.addColorStop(1, 'rgba(255,255,255,0)');
          fctx.fillStyle = streak;
          fctx.fillRect(-streakLength, -2, streakLength * 2, 4);
          fctx.restore();
        }
        const layerCtx = layer.canvas.getContext('2d');
        layerCtx.save();
        layerCtx.globalCompositeOperation = 'lighter';
        layerCtx.drawImage(flare, 0, 0);
        layerCtx.restore();
      }

      function createTextCanvas(text, fontSize, fontFamily, color) {
        const temp = document.createElement('canvas');
        const ctx = temp.getContext('2d');
        const fontSpec = `${fontSize}px ${fontFamily}`;
        ctx.font = fontSpec;
        const metrics = ctx.measureText(text || ' ');
        const width = Math.max(1, Math.ceil(metrics.width) + 12);
        const height = Math.max(1, Math.ceil(fontSize * 1.2));
        temp.width = width;
        temp.height = height;
        ctx.font = fontSpec;
        ctx.textBaseline = 'top';
        ctx.fillStyle = color;
        ctx.fillText(text || '', 0, 0);
        return temp;
      }

      function addTextLayerFromInputs() {
        const text = textStringInput?.value || 'Type here';
        const fontSize = Math.max(8, parseInt(textFontSizeInput.value, 10) || 36);
        const fontFamily = textFontFamilySelect?.value || 'Arial';
        const color = textColorInput?.value || '#e0e0e0';
        const textCanvas = createTextCanvas(text, fontSize, fontFamily, color);
        const layer = {
          id: crypto.randomUUID(),
          name: `Text: ${text.substring(0, 12)}`,
          canvas: textCanvas,
          x: Math.round(state.canvasSize.width / 2 - textCanvas.width / 2),
          y: Math.round(state.canvasSize.height / 2 - textCanvas.height / 2),
          opacity: 1,
          visible: true,
          isText: true,
          text,
          fontSize,
          fontFamily,
          textColor: color
        };
        captureSnapshot();
        state.layers.push(layer);
        state.selectedLayerId = layer.id;
        statusLayer.textContent = `Layer: ${layer.name}`;
        updateLayerPanel();
        renderCanvas();
        saveWorkspace();
      }

      function updateActiveTextLayer(finalize = false) {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer || !layer.isText) return;
        const text = textStringInput?.value || layer.text;
        const fontSize = Math.max(8, parseInt(textFontSizeInput?.value, 10) || layer.fontSize || 36);
        const fontFamily = textFontFamilySelect?.value || layer.fontFamily;
        const color = textColorInput?.value || layer.textColor;
        layer.text = text;
        layer.fontSize = fontSize;
        layer.fontFamily = fontFamily;
        layer.textColor = color;
        const textCanvas = createTextCanvas(text, fontSize, fontFamily, color);
        layer.canvas = textCanvas;
        if (finalize) captureSnapshot();
        renderCanvas();
        updateLayerPanel();
        if (finalize) saveWorkspace();
      }
      function toggleAspectLock() {
        aspectLockActive = !aspectLockActive;
        aspectLockBtn?.classList.toggle('active', aspectLockActive);
        if (aspectLockBtn) {
          aspectLockBtn.textContent = aspectLockActive ? '🔒' : '🔓';
        }
        if (aspectLockActive) {
          aspectRatio = state.canvasSize.width / state.canvasSize.height;
        }
      }

      syncCanvasInputs();

      function serializeWorkspace() {
        return {
          canvasSize: { ...state.canvasSize },
          zoom: state.zoom,
          selectedLayerId: state.selectedLayerId,
          gradient: {
            stops: state.gradient.stops.map((stop) => ({ ...stop })),
            radius: state.gradient.radius,
            focusX: state.gradient.focusX,
            focusY: state.gradient.focusY
          },
          layers: state.layers.map((layer) => ({
            id: layer.id,
            name: layer.name,
            x: layer.x,
            y: layer.y,
            opacity: layer.opacity,
            visible: layer.visible,
            width: layer.canvas.width,
            height: layer.canvas.height,
            data: layer.canvas.toDataURL('image/png')
          })),
          windowBounds: { ...state.windowBounds }
        };
      }

      function saveWorkspace() {
        persistWindows();
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      async function loadWorkspace() {
        const saved = localStorage.getItem(STORAGE_KEY);
        windows.length = 0;
        if (saved) {
          try {
            const payload = JSON.parse(saved);
            if (Array.isArray(payload.windows) && payload.windows.length) {
              payload.windows.forEach((win) => {
                windows.push({
                  id: win.id || crypto.randomUUID(),
                  title: win.title || 'Untitled',
                  snapshot: win.snapshot || blankSnapshot()
                });
              });
              activeWindowIndex = Math.min(
                payload.activeWindowIndex ?? 0,
                windows.length - 1
              );
            }
          } catch (error) {
            console.warn('Failed to parse workspace', error);
          }
        }
        if (!windows.length) {
          windows.push({ id: crypto.randomUUID(), title: 'Untitled-1', snapshot: blankSnapshot() });
          activeWindowIndex = 0;
        }
        updateWindowMenu();
        await applySnapshot(windows[activeWindowIndex].snapshot);
      }

      function captureSnapshot() {
        if (isApplyingHistory) return;
        const snapshot = serializeWorkspace();
        historyStack.splice(historyIndex + 1, historyStack.length - historyIndex - 1);
        historyStack.push(snapshot);
        if (historyStack.length > MAX_HISTORY) {
          historyStack.shift();
        }
        historyIndex = historyStack.length - 1;
        saveCurrentWindowSnapshot();
      }

      async function applySnapshot(snapshot) {
        if (!snapshot) return;
        isApplyingHistory = true;
        state.canvasSize = snapshot.canvasSize || state.canvasSize;
        state.zoom = snapshot.zoom || state.zoom;
        state.gradient = snapshot.gradient
          ? {
              stops:
                snapshot.gradient.stops && snapshot.gradient.stops.length
                  ? snapshot.gradient.stops.map((stop) => ({ ...stop }))
                  : state.gradient.stops.map((stop) => ({ ...stop })),
              radius: snapshot.gradient.radius ?? state.gradient.radius,
              focusX: snapshot.gradient.focusX ?? state.gradient.focusX,
              focusY: snapshot.gradient.focusY ?? state.gradient.focusY
            }
          : state.gradient;
        gradientStops.innerHTML = '';
        renderGradientStops();
        canvas.width = state.canvasSize.width;
        canvas.height = state.canvasSize.height;
        canvas.style.width = state.canvasSize.width + 'px';
        canvas.style.height = state.canvasSize.height + 'px';
        resizeWidth.value = state.canvasSize.width;
        resizeHeight.value = state.canvasSize.height;
        state.layers = [];
        const entries = snapshot.layers || [];
        for (const entry of entries) {
          try {
            const img = await loadImage(entry.data);
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = entry.width;
            layerCanvas.height = entry.height;
            layerCanvas.getContext('2d').drawImage(img, 0, 0);
            state.layers.push({
              id: entry.id,
              name: entry.name,
              canvas: layerCanvas,
              x: entry.x,
              y: entry.y,
              opacity: entry.opacity,
              visible: entry.visible
            });
        } catch (error) {
          console.warn('Layer load failed', entry.name, error);
        }
      }
      state.selectedLayerId = snapshot.selectedLayerId || (state.layers[0] && state.layers[0].id) || null;
      state.windowBounds = snapshot.windowBounds || state.windowBounds;
      applyWindowBounds();
      statusLayer.textContent = state.selectedLayerId
        ? `Layer: ${state.layers.find((l) => l.id === state.selectedLayerId)?.name ?? 'Layer'}`
        : 'Layer: none';
      updateLayerPanel();
      captureLayerBase();
      refreshZoomLabel();
        ensureWindowFitsCanvas();
        syncCanvasInputs();
      isApplyingHistory = false;
    }

      function undoHistory() {
        if (historyIndex <= 0) return;
        historyIndex -= 1;
        applySnapshot(historyStack[historyIndex]).then(() => saveWorkspace());
      }

      function renderCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const layer of state.layers) {
          if (!layer.visible || layer.opacity <= 0) continue;
          ctx.globalAlpha = layer.opacity;
          ctx.drawImage(layer.canvas, layer.x, layer.y);
        }
        ctx.globalAlpha = 1;
        if (state.marquee) {
          const x = Math.min(state.marquee.x1, state.marquee.x2);
          const y = Math.min(state.marquee.y1, state.marquee.y2);
          const w = Math.abs(state.marquee.x2 - state.marquee.x1);
          const h = Math.abs(state.marquee.y2 - state.marquee.y1);
          if (w > 0 && h > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.setLineDash([8, 6]);
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
            ctx.restore();
          }
        }
      }

      function refreshZoomLabel() {
        const percent = Math.round(state.zoom * 100);
        zoomBadge.textContent = percent + '%';
        zoomHint.textContent = `Zoom: ${percent}%`;
        updateDocTitle();
      }

      function setZoom(target) {
        state.zoom = Math.min(3, Math.max(0.25, target));
        canvas.style.transform = `scale(${state.zoom})`;
        const wrapper = document.getElementById('canvasShell');
        wrapper.scrollTop = wrapper.scrollLeft = 0;
        refreshZoomLabel();
      }

      function pickLayerAt(x, y) {
        for (let i = state.layers.length - 1; i >= 0; i--) {
          const layer = state.layers[i];
          if (!layer.visible) continue;
          if (
            x >= layer.x &&
            x <= layer.x + layer.canvas.width &&
            y >= layer.y &&
            y <= layer.y + layer.canvas.height
          ) {
            return layer;
          }
        }
        return null;
      }

      function updateLayerPanel() {
        layersList.innerHTML = '';
        const displayLayers = [...state.layers].slice().reverse();
        displayLayers.forEach((layer) => {
          const entry = document.createElement('div');
          entry.className = 'layer-entry' + (state.selectedLayerId === layer.id ? ' active' : '');
          entry.dataset.layerId = layer.id;
          entry.draggable = true;
          entry.addEventListener('dragstart', (event) => {
            event.dataTransfer?.setData('text/plain', layer.id);
            entry.classList.add('dragging');
          });
          entry.addEventListener('dragend', () => {
            entry.classList.remove('dragging');
          });
          entry.addEventListener('dragover', (event) => {
            event.preventDefault();
            entry.classList.add('drag-over');
          });
          entry.addEventListener('dragleave', () => {
            entry.classList.remove('drag-over');
          });
          entry.addEventListener('drop', (event) => {
            event.preventDefault();
            entry.classList.remove('drag-over');
            const dragId = event.dataTransfer?.getData('text/plain');
            if (dragId) reorderLayers(dragId, layer.id);
          });
          const thumb = document.createElement('div');
          thumb.className = 'thumb';
          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = 48;
          thumbCanvas.height = 34;
          thumb.appendChild(thumbCanvas);
          thumbCanvas.getContext('2d').drawImage(layer.canvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
          const info = document.createElement('div');
          info.className = 'info';
          const title = document.createElement('strong');
          title.textContent = layer.name;
          const props = document.createElement('div');
          props.style.display = 'flex';
          props.style.justifyContent = 'space-between';
          props.style.fontSize = '11px';
          props.style.color = 'var(--text-muted)';
          props.innerHTML = `X:${Math.round(layer.x)} Y:${Math.round(layer.y)}`;
          const opacityTrack = document.createElement('input');
          opacityTrack.type = 'range';
          opacityTrack.min = 0;
          opacityTrack.max = 1;
          opacityTrack.step = 0.01;
          opacityTrack.value = layer.opacity;
          opacityTrack.addEventListener('input', (event) => {
            layer.opacity = parseFloat(event.target.value);
            renderCanvas();
            saveWorkspace();
          });
          const controls = document.createElement('div');
          controls.className = 'layer-controls';
          const visBtn = document.createElement('button');
          visBtn.textContent = layer.visible ? 'Hide' : 'Show';
          visBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            layer.visible = !layer.visible;
            visBtn.textContent = layer.visible ? 'Hide' : 'Show';
            renderCanvas();
            saveWorkspace();
          });
          const upBtn = document.createElement('button');
          upBtn.textContent = 'Up';
          upBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            const idx = state.layers.indexOf(layer);
            if (idx < state.layers.length - 1) {
              state.layers.splice(idx, 1);
              state.layers.splice(idx + 1, 0, layer);
              updateLayerPanel();
              renderCanvas();
              saveWorkspace();
            }
          });
          const downBtn = document.createElement('button');
          downBtn.textContent = 'Down';
          downBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            const idx = state.layers.indexOf(layer);
            if (idx > 0) {
              state.layers.splice(idx, 1);
              state.layers.splice(idx - 1, 0, layer);
              updateLayerPanel();
              renderCanvas();
              saveWorkspace();
            }
          });
          controls.append(visBtn, upBtn, downBtn);
          info.append(title, props, opacityTrack, controls);
          entry.append(thumb, info);
          entry.addEventListener('click', () => {
            state.selectedLayerId = layer.id;
            statusLayer.textContent = `Layer: ${layer.name}`;
            updateLayerPanel();
            captureLayerBase();
          });
        layersList.appendChild(entry);
      });
        updateDocTitle();
        updateSelectedLayerInputs();
      }

      const layerResizeBase = { canvas: null, width: 0, height: 0, x: 0, y: 0 };

      function captureLayerBase() {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer) return;
        const baseCanvas = document.createElement('canvas');
        baseCanvas.width = layer.canvas.width;
        baseCanvas.height = layer.canvas.height;
        baseCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);
        layerResizeBase.canvas = baseCanvas;
        layerResizeBase.width = layer.canvas.width;
        layerResizeBase.height = layer.canvas.height;
        layerResizeBase.x = layer.x;
        layerResizeBase.y = layer.y;
      }

      function updateSelectedLayerInputs() {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer || !layerWidthInput || !layerHeightInput) return;
        layerWidthInput.value = Math.round(layer.canvas.width);
        layerHeightInput.value = Math.round(layer.canvas.height);
        layerRotate = 0;
        layerRotateInput && (layerRotateInput.value = '0');
        layerFlipped = false;
        layerFlipBtn?.classList.remove('active');
        captureLayerBase();
      }

      function currentLayerName() {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        return layer ? layer.name : 'No Layer';
      }

      function updateDocTitle() {
        if (!docTitle) return;
        const percent = Math.round(state.zoom * 100);
        const title = windows[activeWindowIndex]?.title || 'Untitled';
        docTitle.textContent = `${title} @ ${percent}% (${currentLayerName()})`;
      }

      function applyWindowBounds() {
        if (!docWindow) return;
        docWindow.style.left = `${state.windowBounds.left}px`;
        docWindow.style.top = `${state.windowBounds.top}px`;
        docWindow.style.width = `${state.windowBounds.width}px`;
        docWindow.style.height = `${state.windowBounds.height}px`;
      }

      function ensureWindowFitsCanvas() {
        const minWidth = state.canvasSize.width + 80;
        const minHeight = state.canvasSize.height + 140;
        let changed = false;
        if (state.windowBounds.width < minWidth) {
          state.windowBounds.width = minWidth;
          changed = true;
        }
        if (state.windowBounds.height < minHeight) {
          state.windowBounds.height = minHeight;
          changed = true;
        }
        if (changed) {
          applyWindowBounds();
          saveWorkspace();
        }
      }

      const minWindowWidth = 420;
      const minWindowHeight = 320;
      let windowDrag = null;
      let windowResize = null;

      docHeader?.addEventListener('mousedown', (event) => {
        if (event.target === resizeHandle) return;
        windowDrag = {
          startX: event.clientX,
          startY: event.clientY,
          left: state.windowBounds.left,
          top: state.windowBounds.top
        };
        event.preventDefault();
      });

      resizeHandle?.addEventListener('mousedown', (event) => {
        windowResize = {
          startX: event.clientX,
          startY: event.clientY,
          width: state.windowBounds.width,
          height: state.windowBounds.height
        };
        event.preventDefault();
        event.stopPropagation();
      });

      document.addEventListener('mousemove', (event) => {
        if (windowDrag) {
          const dx = event.clientX - windowDrag.startX;
          const dy = event.clientY - windowDrag.startY;
          state.windowBounds.left = Math.max(20, windowDrag.left + dx);
          state.windowBounds.top = Math.max(20, windowDrag.top + dy);
          applyWindowBounds();
        }
        if (windowResize) {
          const dx = event.clientX - windowResize.startX;
          const dy = event.clientY - windowResize.startY;
          state.windowBounds.width = Math.max(minWindowWidth, windowResize.width + dx);
          state.windowBounds.height = Math.max(minWindowHeight, windowResize.height + dy);
          applyWindowBounds();
        }
      });

      document.addEventListener('mouseup', () => {
        if (windowDrag) {
          saveWorkspace();
          windowDrag = null;
        }
        if (windowResize) {
          saveWorkspace();
          windowResize = null;
        }
      });

      function reorderLayers(dragId, dropId) {
        if (dragId === dropId) return;
        captureSnapshot();
        const dragIndex = state.layers.findIndex((l) => l.id === dragId);
        const dropIndex = state.layers.findIndex((l) => l.id === dropId);
        if (dragIndex === -1 || dropIndex === -1) return;
        const [dragLayer] = state.layers.splice(dragIndex, 1);
        const targetIndex = dropIndex > dragIndex ? dropIndex - 1 : dropIndex;
        state.layers.splice(targetIndex, 0, dragLayer);
        state.selectedLayerId = dragLayer.id;
        updateLayerPanel();
        renderCanvas();
        saveWorkspace();
      }

      function addLayer(canvasSource, name = 'Layer ' + (state.layers.length + 1)) {
        captureSnapshot();
        const layerCanvas = document.createElement('canvas');
        layerCanvas.width = canvasSource.width;
        layerCanvas.height = canvasSource.height;
        layerCanvas.getContext('2d').drawImage(canvasSource, 0, 0);
        const layer = {
          id: crypto.randomUUID(),
          name,
          canvas: layerCanvas,
          x: Math.round(state.canvasSize.width / 2 - layerCanvas.width / 2),
          y: Math.round(state.canvasSize.height / 2 - layerCanvas.height / 2),
          opacity: 1,
          visible: true
        };
        state.layers.push(layer);
        state.selectedLayerId = layer.id;
        statusLayer.textContent = `Layer: ${layer.name}`;
        updateLayerPanel();
        renderCanvas();
        saveWorkspace();
        captureLayerBase();
      }

      function handleFiles(files) {
        for (const file of files) {
          if (!file.type.startsWith('image/')) continue;
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              addLayer(img, file.name);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      }

      document.querySelectorAll('.tool-btn').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.tool-btn').forEach((btn) => btn.classList.remove('active'));
          button.classList.add('active');
          state.activeTool = button.dataset.tool;
          gradientEditor.classList.toggle('visible', state.activeTool === 'gradient');
          textEditor?.classList.toggle('visible', state.activeTool === 'text');
        });
      });

      document.querySelector('[data-action="import"]').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      document.getElementById('fileInput').addEventListener('change', (event) => {
        handleFiles(event.target.files);
        event.target.value = '';
      });

      document
        .getElementById('canvasShell')
        .addEventListener('dragover', (event) => {
          event.preventDefault();
        });
      document
        .getElementById('canvasShell')
        .addEventListener('drop', (event) => {
          event.preventDefault();
          handleFiles(event.dataTransfer.files);
        });

      document.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.metaKey) {
          if (event.key.toLowerCase() === 's') {
            event.preventDefault();
            exportDocument();
          }
          if (event.key.toLowerCase() === 'j') {
            event.preventDefault();
            duplicateLayer();
          }
          if (event.key.toLowerCase() === 'e') {
            event.preventDefault();
            mergeLayerDown();
          }
          if (event.key.toLowerCase() === 'z' && !event.shiftKey) {
            event.preventDefault();
            undoHistory();
          }
          if (event.key === '+' || event.key === '=') {
            event.preventDefault();
            setZoom(state.zoom + 0.1);
          }
          if (event.key === '-') {
            event.preventDefault();
            setZoom(state.zoom - 0.1);
          }
        } else {
          if (event.key.toLowerCase() === 'v') selectTool('move');
          if (event.key.toLowerCase() === 'm') selectTool('marquee');
          if (event.key.toLowerCase() === 'z') selectTool('zoom');
          if (event.key.toLowerCase() === 'g') selectTool('gradient');
          if (event.key.toLowerCase() === 't') selectTool('text');
          if (event.key.toLowerCase() === 'h') selectTool('hand');
        }
        if (event.key === 'Delete') {
          deleteLayer();
        }
        if (event.key === '0' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          setZoom(1);
        }
      });

      function selectTool(tool) {
        const button = document.querySelector(`.tool-btn[data-tool="${tool}"]`);
        if (!button) return;
        button.click();
      }

      function duplicateLayer() {
        captureSnapshot();
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer) return;
        const dupCanvas = document.createElement('canvas');
        dupCanvas.width = layer.canvas.width;
        dupCanvas.height = layer.canvas.height;
        dupCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);
        const copy = {
          id: crypto.randomUUID(),
          name: layer.name + ' copy',
          canvas: dupCanvas,
          x: layer.x + 20,
          y: layer.y + 20,
          opacity: layer.opacity,
          visible: layer.visible
        };
        state.layers.push(copy);
        state.selectedLayerId = copy.id;
        updateLayerPanel();
        renderCanvas();
        saveWorkspace();
      }

      function mergeLayerDown() {
        captureSnapshot();
        const idx = state.layers.findIndex((l) => l.id === state.selectedLayerId);
        if (idx <= 0) return;
        const top = state.layers[idx];
        const bottom = state.layers[idx - 1];
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = bottom.canvas.width;
        tempCanvas.height = bottom.canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(bottom.canvas, 0, 0);
        tempCtx.globalAlpha = top.opacity;
        tempCtx.drawImage(top.canvas, top.x - bottom.x, top.y - bottom.y);
        bottom.canvas = tempCanvas;
        bottom.opacity = bottom.opacity;
        state.layers.splice(idx, 1);
        state.selectedLayerId = bottom.id;
        updateLayerPanel();
        renderCanvas();
        saveWorkspace();
      }

      function deleteLayer() {
        captureSnapshot();
        const idx = state.layers.findIndex((l) => l.id === state.selectedLayerId);
        if (idx === -1) return;
        state.layers.splice(idx, 1);
        state.selectedLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
        statusLayer.textContent = state.selectedLayerId
          ? `Layer: ${state.layers.find((l) => l.id === state.selectedLayerId).name}`
          : 'Layer: none';
        updateLayerPanel();
        renderCanvas();
        saveWorkspace();
      }

      let pointerState = null;

      canvas.addEventListener('mousedown', (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) / state.zoom;
        const y = (event.clientY - rect.top) / state.zoom;
        statusCoords.textContent = `X: ${Math.round(x)} Y: ${Math.round(y)}`;
        if (state.activeTool === 'hand') {
          pointerState = {
            type: 'pan',
            startX: event.clientX,
            startY: event.clientY,
            startScrollLeft: canvasShell.scrollLeft,
            startScrollTop: canvasShell.scrollTop
          };
          canvasShell.classList.add('hand-active');
          return;
        }
        if (state.activeTool === 'fill') {
          const target = pickLayerAt(x, y) || state.layers.find((l) => l.id === state.selectedLayerId);
          if (target) {
            captureSnapshot();
            const ctxFill = target.canvas.getContext('2d');
            ctxFill.fillStyle = fillColorInput.value;
            ctxFill.fillRect(0, 0, target.canvas.width, target.canvas.height);
            state.selectedLayerId = target.id;
            statusLayer.textContent = `Layer: ${target.name}`;
            renderCanvas();
            updateLayerPanel();
            saveWorkspace();
          }
          return;
        }
        if (state.activeTool === 'move') {
          const layer = pickLayerAt(x, y);
          if (layer) {
            state.selectedLayerId = layer.id;
            statusLayer.textContent = `Layer: ${layer.name}`;
            pointerState = {
              type: 'move',
              layer,
              offsetX: x - layer.x,
              offsetY: y - layer.y
            };
            pointerState.moved = false;
            updateLayerPanel();
          }
        } else if (state.activeTool === 'marquee') {
          state.marquee = { x1: x, y1: y, x2: x, y2: y };
          pointerState = { type: 'marquee' };
        }
      });

      window.addEventListener('mousemove', (event) => {
        if (!pointerState) return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) / state.zoom;
        const y = (event.clientY - rect.top) / state.zoom;
        statusCoords.textContent = `X: ${Math.round(x)} Y: ${Math.round(y)}`;
        if (pointerState.type === 'move' && pointerState.layer) {
          pointerState.layer.x = x - pointerState.offsetX;
          pointerState.layer.y = y - pointerState.offsetY;
          renderCanvas();
          updateLayerPanel();
          pointerState.moved = true;
        }
        if (pointerState.type === 'pan') {
          const dx = event.clientX - pointerState.startX;
          const dy = event.clientY - pointerState.startY;
          canvasShell.scrollLeft = pointerState.startScrollLeft - dx;
          canvasShell.scrollTop = pointerState.startScrollTop - dy;
          return;
        }
        if (pointerState.type === 'marquee') {
          state.marquee.x2 = x;
          state.marquee.y2 = y;
        }
      });

      window.addEventListener('mouseup', () => {
        if (pointerState && pointerState.type === 'marquee') {
          // keep marquee active until user applies
        }
        if (pointerState && pointerState.type === 'move' && pointerState.moved) {
          saveWorkspace();
        }
        if (pointerState && pointerState.type === 'pan') {
          canvasShell.classList.remove('hand-active');
        }
        pointerState = null;
      });

      function applyCrop() {
        if (!state.marquee) return;
        captureSnapshot();
        const x1 = Math.min(state.marquee.x1, state.marquee.x2);
        const y1 = Math.min(state.marquee.y1, state.marquee.y2);
        const x2 = Math.max(state.marquee.x1, state.marquee.x2);
        const y2 = Math.max(state.marquee.y1, state.marquee.y2);
        const width = Math.max(10, Math.round(x2 - x1));
        const height = Math.max(10, Math.round(y2 - y1));
        const cropRect = { x: x1, y: y1, width, height };
        const newLayers = [];
        for (const layer of state.layers) {
          const layerRect = {
            x: layer.x,
            y: layer.y,
            width: layer.canvas.width,
            height: layer.canvas.height
          };
          const interLeft = Math.max(layerRect.x, cropRect.x);
          const interTop = Math.max(layerRect.y, cropRect.y);
          const interRight = Math.min(layerRect.x + layerRect.width, cropRect.x + cropRect.width);
          const interBottom = Math.min(layerRect.y + layerRect.height, cropRect.y + cropRect.height);
          const interWidth = interRight - interLeft;
          const interHeight = interBottom - interTop;
          if (interWidth <= 0 || interHeight <= 0) continue;
          const temp = document.createElement('canvas');
          temp.width = interWidth;
          temp.height = interHeight;
          temp.getContext('2d').drawImage(
            layer.canvas,
            interLeft - layerRect.x,
            interTop - layerRect.y,
            interWidth,
            interHeight,
            0,
            0,
            interWidth,
            interHeight
          );
          newLayers.push({
            ...layer,
            canvas: temp,
            x: interLeft - cropRect.x,
            y: interTop - cropRect.y
          });
        }
        state.layers = newLayers;
        state.canvasSize.width = width;
        state.canvasSize.height = height;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        state.marquee = null;
        renderCanvas();
        updateLayerPanel();
        const active = state.layers[state.layers.length - 1];
        state.selectedLayerId = active ? active.id : null;
        statusLayer.textContent = active ? `Layer: ${active.name}` : 'Layer: none';
        resizeWidth.value = width;
        resizeHeight.value = height;
        saveWorkspace();
        ensureWindowFitsCanvas();
      }

      document.querySelector('[data-action="export"]').addEventListener('click', () => {
        exportDocument();
      });
      document.querySelector('[data-action="apply-crop"]').addEventListener('click', () => {
        applyCrop();
      });

      function exportDocument() {
        const format = document.getElementById('formatSelect').value;
        const blobPromise = createExportBlob(format);
        blobPromise.then((blob) => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = `indiedraw-export.${getExtension(format)}`;
          link.href = url;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        });
      }

      function getExtension(format) {
        if (format === 'application/pdf') return 'pdf';
        if (format === 'image/svg+xml') return 'svg';
        if (format === 'image/jpeg') return 'jpg';
        return format.split('/')[1];
      }

      async function createExportBlob(format) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = state.canvasSize.width;
        tempCanvas.height = state.canvasSize.height;
        const tempCtx = tempCanvas.getContext('2d');
        state.layers.forEach((layer) => {
          if (layer.visible) {
            tempCtx.globalAlpha = layer.opacity;
            tempCtx.drawImage(layer.canvas, layer.x, layer.y);
          }
        });
        tempCtx.globalAlpha = 1;
        if (format === 'application/pdf') {
          const jpeg = tempCanvas.toDataURL('image/jpeg', 0.9);
          return pdfBlobFromDataURI(jpeg, tempCanvas.width, tempCanvas.height);
        }
        if (format === 'image/svg+xml') {
          const pngData = tempCanvas.toDataURL('image/png');
          const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${tempCanvas.width}' height='${
            tempCanvas.height
          }'><image href='${pngData}' width='${tempCanvas.width}' height='${tempCanvas.height}'/></svg>`;
          return new Blob([svg], { type: 'image/svg+xml' });
        }
        return await new Promise((resolve) => {
          tempCanvas.toBlob((blob) => resolve(blob), format, format === 'image/png' ? 1 : 0.9);
        });
      }

      function pdfBlobFromDataURI(dataURI, width, height) {
        const base64 = dataURI.split(',')[1];
        const binary = atob(base64);
        const imageBytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          imageBytes[i] = binary.charCodeAt(i);
        }
        const encode = (str) => {
          const arr = new Uint8Array(str.length);
          for (let i = 0; i < str.length; i += 1) {
            arr[i] = str.charCodeAt(i);
          }
          return arr;
        };
        const chunks = [];
        let cursor = 0;
        const appendChunk = (chunk) => {
          chunks.push(chunk);
          cursor += chunk.length;
        };
        const appendString = (text) => appendChunk(encode(text));
        const objectOffsets = [];
        appendString('%PDF-1.3\n');
        const writeObject = (content) => {
          objectOffsets.push(cursor);
          appendString(content);
        };
        writeObject('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
        writeObject('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
        writeObject(
          `3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width} ${height}] /Resources << /XObject << /Im1 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>\nendobj\n`
        );
        objectOffsets.push(cursor);
        appendString(
          `4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imageBytes.length} >>\nstream\n`
        );
        appendChunk(imageBytes);
        appendString('\nendstream\nendobj\n');
        const pageContent = `q\n${width} 0 0 ${height} 0 0 cm\n/Im1 Do\nQ\n`;
        writeObject(`5 0 obj\n<< /Length ${pageContent.length} >>\nstream\n${pageContent}endstream\nendobj\n`);
        const xrefStart = cursor;
        appendString('xref\n0 6\n');
        appendString('0000000000 65535 f \n');
        objectOffsets.forEach((offset) => {
          appendString(`${String(offset).padStart(10, '0')} 00000 n \n`);
        });
        appendString('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n');
        appendString(`${xrefStart}\n%%EOF`);
        return new Blob(chunks, { type: 'application/pdf' });
      }

      document.querySelector('[data-action="resize"]').addEventListener('click', () => {
        const width = Math.max(64, parseInt(resizeWidth.value, 10));
        const height = Math.max(64, parseInt(resizeHeight.value, 10));
        resizeDocument(width, height);
      });

      document.querySelector('[data-action="resize-canvas"]').addEventListener('click', () => {
        const width = Math.max(64, parseInt(canvasWidthInput.value, 10));
        const height = Math.max(64, parseInt(canvasHeightInput.value, 10));
        captureSnapshot();
        setCanvasDimensions(width, height);
      });
      document.querySelector('[data-action="resize-layer"]').addEventListener('click', () => {
        applyLayerResize();
      });

      [resizeWidth, canvasWidthInput].forEach((input) => {
        input?.addEventListener('input', (event) => {
          const value = parseInt(event.target.value, 10);
          if (!Number.isNaN(value)) {
            updateDimensionInputs('width', value);
            handleLinkedDimension('width', value);
          }
        });
      });
      [resizeHeight, canvasHeightInput].forEach((input) => {
        input?.addEventListener('input', (event) => {
          const value = parseInt(event.target.value, 10);
          if (!Number.isNaN(value)) {
            updateDimensionInputs('height', value);
            handleLinkedDimension('height', value);
          }
        });
      });
      aspectLockBtn?.addEventListener('click', toggleAspectLock);
      layerWidthInput?.addEventListener('input', (event) => {
        handleLayerDimension('width', parseInt(event.target.value, 10));
        applyLayerResize(false);
      });
      layerHeightInput?.addEventListener('input', (event) => {
        handleLayerDimension('height', parseInt(event.target.value, 10));
        applyLayerResize(false);
      });
      layerAspectLock?.addEventListener('click', toggleLayerAspectLock);
      layerRotateInput?.addEventListener('input', (event) => {
        layerRotate = parseInt(event.target.value, 10) || 0;
        applyLayerRotation(false);
      });
      layerFlipBtn?.addEventListener('click', () => {
        layerFlipped = !layerFlipped;
        layerFlipBtn.classList.toggle('active', layerFlipped);
        applyLayerRotation(false);
      });
      document.querySelector('[data-action="apply-layer-transform"]').addEventListener('click', () => {
        applyLayerRotation(true);
      });
      document.querySelector('[data-action="add-text-layer"]').addEventListener('click', addTextLayerFromInputs);
      document.querySelector('[data-action="update-text-layer"]').addEventListener('click', () => updateActiveTextLayer(true));
      textStringInput?.addEventListener('input', () => updateActiveTextLayer());
      textFontSizeInput?.addEventListener('input', () => updateActiveTextLayer());
      textFontFamilySelect?.addEventListener('change', () => updateActiveTextLayer());
      textColorInput?.addEventListener('input', () => updateActiveTextLayer());
      pluginMenuLensFlare?.addEventListener('click', () => {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer) {
          alert('Select a layer to apply the lens flare.');
          return;
        }
        captureSnapshot();
        applyLensFlareToLayer(layer);
        renderCanvas();
        updateLayerPanel();
        saveWorkspace();
      });
      gradientTypeSelect?.addEventListener('change', (event) => {
        state.gradient.mode = event.target.value;
        renderPreview();
      });

      function resizeDocument(width, height) {
        captureSnapshot();
        const scaleX = width / state.canvasSize.width;
        const scaleY = height / state.canvasSize.height;
        state.layers.forEach((layer) => {
          const scaledCanvas = document.createElement('canvas');
          scaledCanvas.width = Math.max(1, Math.round(layer.canvas.width * scaleX));
          scaledCanvas.height = Math.max(1, Math.round(layer.canvas.height * scaleY));
          scaledCanvas
            .getContext('2d')
            .drawImage(layer.canvas, 0, 0, layer.canvas.width, layer.canvas.height, 0, 0, scaledCanvas.width, scaledCanvas.height);
          layer.canvas = scaledCanvas;
          layer.x = layer.x * scaleX;
          layer.y = layer.y * scaleY;
        });
        setCanvasDimensions(width, height);
      }

      function setCanvasDimensions(width, height) {
        state.canvasSize.width = width;
        state.canvasSize.height = height;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        aspectRatio = width / height;
        renderCanvas();
        updateLayerPanel();
        resizeWidth.value = width;
        resizeHeight.value = height;
        syncCanvasInputs();
        resetPan();
        saveWorkspace();
        ensureWindowFitsCanvas();
      }

      document.querySelector('[data-action="apply-gradient"]').addEventListener('click', () => {
        const layer = state.layers.find((l) => l.id === state.selectedLayerId);
        if (!layer) return;
        captureSnapshot();
        const ctxLayer = layer.canvas.getContext('2d');
        ctxLayer.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
        let gradient;
        if (state.gradient.mode === 'linear') {
          gradient = ctxLayer.createLinearGradient(0, layer.canvas.height / 2, layer.canvas.width, layer.canvas.height / 2);
        } else {
          const centerX = (state.gradient.focusX / 100) * layer.canvas.width;
          const centerY = (state.gradient.focusY / 100) * layer.canvas.height;
          gradient = ctxLayer.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            (Math.max(layer.canvas.width, layer.canvas.height) * state.gradient.radius) / 100
          );
        }
        state.gradient.stops
          .sort((a, b) => a.pos - b.pos)
          .forEach((stop) => {
            gradient.addColorStop(stop.pos / 100, stop.color);
          });
        ctxLayer.fillStyle = gradient;
        ctxLayer.fillRect(0, 0, layer.canvas.width, layer.canvas.height);
        renderCanvas();
        updateLayerPanel();
        saveWorkspace();
      });

      document.querySelector('[data-action="add-stop"]').addEventListener('click', () => {
        if (state.gradient.stops.length >= 5) return;
        state.gradient.stops.push({ id: crypto.randomUUID(), color: '#ffffff', pos: 50 });
        renderGradientStops();
        saveWorkspace();
      });

      function renderGradientStops() {
        gradientStops.innerHTML = '';
        state.gradient.stops.forEach((stop) => {
          const row = document.createElement('div');
          row.className = 'gradient-stop';
          const color = document.createElement('input');
          color.type = 'color';
          color.value = stop.color;
          color.addEventListener('input', (event) => {
            stop.color = event.target.value;
            renderPreview();
            saveWorkspace();
          });
          const position = document.createElement('input');
          position.type = 'range';
          position.min = 0;
          position.max = 100;
          position.value = stop.pos;
          position.addEventListener('input', (event) => {
            stop.pos = parseInt(event.target.value, 10);
            label.textContent = `${stop.pos}%`;
            renderPreview();
            saveWorkspace();
          });
          const label = document.createElement('span');
          label.textContent = `${stop.pos}%`;
          const remove = document.createElement('button');
          remove.textContent = '✕';
          remove.addEventListener('click', () => {
            if (state.gradient.stops.length <= 2) return;
            state.gradient.stops = state.gradient.stops.filter((item) => item.id !== stop.id);
            renderGradientStops();
            saveWorkspace();
          });
          row.append(color, position, label, remove);
          gradientStops.appendChild(row);
        });
        renderPreview();
      }

      function renderPreview() {
        const preview = document.querySelector('.gradient-preview');
        if (!preview) return;
        const gradientDefinition = state.gradient.stops
          .map((stop) => `${stop.color} ${(stop.pos).toFixed(0)}%`)
          .join(', ');
        preview.style.background = `radial-gradient(circle at ${state.gradient.focusX}% ${state.gradient.focusY}%, ${gradientDefinition})`;
      }

      radiusInput.addEventListener('input', (event) => {
        state.gradient.radius = parseInt(event.target.value, 10);
        radiusValue.textContent = `${state.gradient.radius}%`;
        saveWorkspace();
      });
      focusXInput.addEventListener('input', (event) => {
        state.gradient.focusX = parseInt(event.target.value, 10);
        focusXValue.textContent = `${state.gradient.focusX}%`;
        saveWorkspace();
      });
      focusYInput.addEventListener('input', (event) => {
        state.gradient.focusY = parseInt(event.target.value, 10);
        focusYValue.textContent = `${state.gradient.focusY}%`;
        saveWorkspace();
      });

      function initGradientPreview() {
        if (!document.querySelector('.gradient-preview')) {
          const preview = document.createElement('div');
          preview.className = 'gradient-preview';
          const gradientContent = gradientEditor.querySelector('.gradient-editor-content');
          const addButton = gradientContent?.querySelector('[data-action="add-stop"]');
          if (gradientContent && addButton) {
            gradientContent.insertBefore(preview, addButton);
          } else {
            gradientEditor.appendChild(preview);
          }
        }
        renderGradientStops();
      }

      initGradientPreview();
      setupCollapsibles();
      fileMenuNew?.addEventListener('click', async (event) => {
        event.preventDefault();
        await createNewWindow();
      });
      fileMenuSave?.addEventListener('click', (event) => {
        event.preventDefault();
        saveWindowTitle();
      });
      fileMenuDelete?.addEventListener('click', async (event) => {
        event.preventDefault();
        if (windows.length <= 1) {
          alert('At least one window must remain.');
          return;
        }
        if (!confirm('Are you sure you want to delete this window?')) return;
        windows.splice(activeWindowIndex, 1);
        const nextIndex = Math.max(0, activeWindowIndex - 1);
        await setActiveWindow(nextIndex);
        persistWindows();
      });

      function setupMenus() {
        const timers = new Map();
        document.querySelectorAll('.menu-group').forEach((group) => {
          group.addEventListener('mouseenter', () => {
            clearTimeout(timers.get(group));
            timers.set(
              group,
              setTimeout(() => {
                group.classList.add('active');
              }, 180)
            );
          });
          group.addEventListener('mouseleave', () => {
            clearTimeout(timers.get(group));
            timers.set(
              group,
              setTimeout(() => {
                group.classList.remove('active');
              }, 220)
            );
          });
        });
      }

      function renderLoop() {
        renderCanvas();
        requestAnimationFrame(renderLoop);
      }

      async function start() {
        await loadWorkspace();
        ensureWindowFitsCanvas();
        captureSnapshot();
        setZoom(state.zoom);
        renderLoop();
      }

      window.addEventListener('beforeunload', saveWorkspace);

      setupMenus();
      applyWindowBounds();
      start();

      document.querySelector('[data-action="zoom-in"]').addEventListener('click', () => setZoom(state.zoom + 0.15));
      document.querySelector('[data-action="zoom-out"]').addEventListener('click', () => setZoom(state.zoom - 0.15));
      document.querySelector('[data-action="reset-zoom"]').addEventListener('click', () => setZoom(1));

      document.getElementById('canvasShell').addEventListener('wheel', (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        setZoom(state.zoom + (event.deltaY > 0 ? -0.05 : 0.05));
      });

      document.querySelector('[data-action="new-layer"]').addEventListener('click', () => {
        const temp = document.createElement('canvas');
        temp.width = 400;
        temp.height = 250;
        temp.getContext('2d').fillStyle = '#1c1f24';
        temp.getContext('2d').fillRect(0, 0, temp.width, temp.height);
        addLayer(temp, 'New Layer');
      });

      document.addEventListener('paste', async (event) => {
        const handled = await tryHandlePaste(event.clipboardData);
        if (handled) {
          event.preventDefault();
          return;
        }
        if (navigator.clipboard?.read) {
          try {
            const clipItems = await navigator.clipboard.read();
            for (const clipItem of clipItems) {
              for (const type of clipItem.types) {
                if (!type.startsWith('image/')) continue;
                const blob = await clipItem.getType(type);
                await createLayerFromBlob(blob);
                event.preventDefault();
                return;
              }
            }
          } catch (error) {
            console.warn('Clipboard read failed', error);
          }
        }
      });

      async function tryHandlePaste(clipboardData) {
        if (!clipboardData) return false;
        const items = Array.from(clipboardData.items || []);
        for (const item of items) {
          if (!item) continue;
          const isImage = item.kind === 'file' ? item.type.startsWith('image/') : item.type.startsWith('image/');
          if (!isImage) continue;
          const blob = item.getAsFile ? item.getAsFile() : null;
          if (!blob) continue;
          await createLayerFromBlob(blob);
          return true;
        }
        return false;
      }

      async function createLayerFromBlob(blob) {
        if (!blob) return;
        try {
          const imageUrl = URL.createObjectURL(blob);
          const img = await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = reject;
            image.src = imageUrl;
          });
          const canvasTemp = document.createElement('canvas');
          canvasTemp.width = img.width;
          canvasTemp.height = img.height;
          canvasTemp.getContext('2d').drawImage(img, 0, 0);
          URL.revokeObjectURL(imageUrl);
          addLayer(canvasTemp, 'Pasted Layer');
        } catch (error) {
          console.warn('Paste failed', error);
        }
      }

      function setupCollapsibles() {
        document.querySelectorAll('.collapse-toggle').forEach((toggle) => {
          const collapsible = toggle.closest('[data-collapsible]');
          const panel = collapsible && collapsible.closest('.panel-group');
          toggle.addEventListener('click', () => {
            if (collapsible) {
              collapsible.classList.toggle('collapsed');
            }
            if (panel) {
              panel.classList.toggle('collapsed');
            }
          });
        });
      }

      document.querySelector('[data-action="delete-layer"]').addEventListener('click', () => {
        deleteLayer();
      });

      renderCanvas();
    </script>
  </body>
</html>
